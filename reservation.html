<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />

    <link rel="stylesheet" type="text/css" href="styles/theme.css" />

    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link rel="stylesheet" type="text/css" href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css" />

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>
      <div id="container">
        <!-- 서브 히어로 -->
        <div class="sub_visual_wide visual">
          <div class="visual_box">
            <div class="visual_txt">
              <span data-property-name-en-caps></span>
              <strong>RESERVATION</strong>
              <p>This place provides the best time for those who are staying</p>
              <div class="sub_cate_wrap">
                <ul>
                  <li><a href="#!" target="_blank" data-booking-link>예약하기</a></li>
                  <li class="on"><a href="./reservation.html">이용안내</a></li>
                </ul>
              </div>
            </div>
            <div class="swiper-container">
              <div class="swiper-wrapper" data-reservation-hero-slides></div>
            </div>
          </div>
        </div>

        <section id="content" class="sub_cont sub4_1 sub_reservation">
          <div class="sub_cont">
            <div class="title_box">
              <p data-reservation-eyebrow></p>
            </div>

            <!-- 원본은 dl 을 두 벌로 나눈다. CSS 의 dl + dl {margin-top:130px} 가
                 두 안내 블록 사이 여백을 만들기 때문에 한 dl 안에 합치면 안 된다. -->
            <dl class="inner">
              <dt class="title_box2">
                <h4>Basic info</h4>
                <p>Reservation Information</p>
              </dt>
              <dd>
                <div class="img" data-reservation-info-image></div>
                <div class="txt" data-reservation-info></div>
              </dd>
            </dl>

            <dl class="inner">
              <dt class="title_box2">
                <h4>Refund Info</h4>
                <p>Reservation Information</p>
              </dt>
              <dd>
                <div class="img" data-reservation-refund-image></div>
                <div class="txt" data-reservation-refund></div>
              </dd>
            </dl>
          </div>
        </section>
      </div>

      <div id="footer-wrap"></div>
    </div>

    <div id="popup-container"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

    <script src="js/data-mapper/pages/reservation-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/reservation.js"></script>
    <script src="js/popup.js"></script>
  </body>
